<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vests - Graceful Fashion</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-roses">
                <img src="../header_pink_rose1.jpg" alt="Pink Rose" class="header-rose">
                <h1>Graceful Fashion</h1>
                <img src="../header_pink_rose2.jpg" alt="Pink Rose" class="header-rose">
            </div>
            <p class="tagline">Elegant Clothing for the Modern Soul</p>
        </div>
    </header>

    <main>
        <section class="collection center-collection">
            <a href="../index.html" class="home-button">Home</a>
            <h2>Vests</h2>
            <div class="products">
                <article class="product-card">
                    <img src="green_hem_vest.jpeg" alt="Green hem vest" class="product-image">
                    <h3>Green Hem Vest</h3>
                    <p class="price">$3,000,000</p>
                </article>
                <article class="product-card">
                    <img src="pink_flower_hem_vest.jpeg" alt="Pink flower hem vest" class="product-image">
                    <h3>Pink Flower Hem Vest</h3>
                    <p class="price">$3,000,000</p>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>✿ Graceful Fashion © 2026 ✿</p>
        <p>Crafted with love and elegance</p>
    </footer>
    <script src="../size-selector.js?v=3"></script>
</body>
</html>
